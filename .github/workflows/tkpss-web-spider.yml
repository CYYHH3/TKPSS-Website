name: TKPSS Website Spider

on:
  schedule:
    - cron: '0 0 15 * *' # 每个月的15日0点（UTC时间）执行
  workflow_dispatch: # 允许手动触发

jobs:
  run-spider:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout repository
      uses: actions/checkout@v2

    - name: 2. Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'  # 选择你需要的 Python 版本

    - name: 3. Install dependencies
      run: |
        cd ".github/workflows"
        python -m pip install --upgrade pip
        pip install -r tkpss-web-spider.txt

    - name: 4. Run Python Spider
      run: |
        python .github/workflows/tkpss-web-spider.py

    - name: 5. Git Push & Discord Notify
      env:
        DC_WEBHOOK: ${{ secrets.DC_WEBHOOK }}
      run: |
        # Configure git user
        git config --global user.name 'TKPSS Website Spider'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'

        # Add changes to git
        git add origin/tkpss.html

        # Prepare Discord message content
        read -r -d '' DC_CONTENT <<EOF
        {
          "embeds": [
            {
              "title": "Workflow Notification",
              "description": "TKPSS Website Spider has updated the data."
            }
          ]
        }
        EOF

        # Check if there are changes to commit
        if git diff-index --quiet HEAD; then
          echo "No changes to commit."
        else
          # Commit changes with a timestamp
          git commit -m "Update data from spider on $(date +'%Y-%m-%d %H:%M:%S (%Z)')"
          # Push changes to the repository
          git push

          # Send a message to Discord
          curl -H "Content-Type: application/json" -d "$DC_CONTENT" $DC_WEBHOOK
        fi

    - name: 6. Send Heartbeat Signal
      env:
        BETTERSTACK: ${{ secrets.BETTERSTACK }}
      run: |
        curl $BETTERSTACK


