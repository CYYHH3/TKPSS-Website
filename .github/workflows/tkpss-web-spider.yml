name: TKPSS Website Spider

on:
  schedule:
    - cron: '0 0 15 * *' # 每个月的15日0点（UTC时间）执行
  workflow_dispatch: # 允许手动触发

jobs:
  run-spider:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'  # 选择你需要的 Python 版本

    - name: Install dependencies
      run: |
        cd ".github/workflows"
        python -m pip install --upgrade pip
        pip install -r tkpss-web-spider.txt

    - name: Run Python Spider
      run: |
        python .github/workflows/tkpss-web-spider.py

    - name: Git Push
      run: |
        git config --global user.name 'TKPSS Website Spider'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add origin/tkpss.html
        git commit -m "Update data from spider on $(date +'%Y-%m-%d %H:%M:%S (%Z)')"
        git push


